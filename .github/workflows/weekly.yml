name: ETF数据每周更新

on:
  schedule:
    - cron: "0 6 * * 6"
  workflow_dispatch:
    inputs:
      mode:
        description: 'seed=全量初始化 | full=增量更新 | quick=快速部署(仅内容,不动行情)'
        required: true
        default: full
        type: choice
        options:
          - full
          - seed
          - quick

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ===== 数据更新（seed 全量 / full 增量）：拉行情 + 重建 =====
      - name: Setup Python
        if: ${{ github.event.inputs.mode != 'quick' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        if: ${{ github.event.inputs.mode != 'quick' }}
        run: pip install pandas
      - name: Update data and build
        if: ${{ github.event.inputs.mode != 'quick' }}
        run: python update_data.py ${{ github.event.inputs.mode == 'seed' && '--full' || '' }}
      - name: Make index page (data)
        if: ${{ github.event.inputs.mode != 'quick' }}
        run: mkdir -p output && cp output/ETF动量轮动回测系统.html output/index.html

      # ===== 快速部署：直接用 web_live（内容改动，不碰行情）=====
      - name: Make index page (quick)
        if: ${{ github.event.inputs.mode == 'quick' }}
        run: mkdir -p output && cp web_live/index.html output/index.html

      # ===== 数据回写：更新后的 data/*.csv 提交回仓库，供下次增量续拉 =====
      - name: Commit data back
        if: ${{ github.event.inputs.mode != 'quick' }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.csv
          if git diff --cached --quiet; then
            echo "行情无变化，跳过提交"
          else
            git commit -m "chore(data): 更新行情(增量/全量)"
            git push origin master
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
