name: ETF数据每周更新

on:
  schedule:
    - cron: "0 6 * * 6"
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Probe free data sources
        run: |
          for u in \
            "https://push2his.eastmoney.com" \
            "https://finance.sina.com.cn" \
            "https://web.ifzq.gtimg.cn" \
            "https://hq.sinajs.cn" \
            "https://github.com" ; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 12 -m 18 -A "Mozilla/5.0" "$u" || echo 000)
            echo "PROBE $code $u"
          done
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install akshare pandas
      - name: Update data and build
        run: python update_data.py
      - name: Make index page
        run: cp output/ETF动量轮动回测系统.html output/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
